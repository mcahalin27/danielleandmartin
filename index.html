<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Danielle & Martin</title>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --cream: #faf8f4;
      --sage: #7d9b76;
      --sage-dark: #5a7a54;
      --charcoal: #2c2c2c;
      --warm-grey: #888;
      --border: #d9d4c7;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: var(--cream);
      color: var(--charcoal);
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* TOP BAR */
    .top-bar { background: var(--sage); padding: 10px 24px; text-align: right; }
    .top-bar a {
      font-family: 'Cormorant Garamond', serif;
      font-size: 0.78rem; letter-spacing: 0.2em;
      text-transform: uppercase; color: white; text-decoration: none;
      border: 1px solid rgba(255,255,255,0.6); padding: 6px 18px;
      transition: background 0.2s;
    }
    .top-bar a:hover { background: rgba(255,255,255,0.15); }

    /* MAIN */
    .password-wrap { flex:1; display:flex; align-items:center; justify-content:center; padding:60px 20px; }
    .password-inner { text-align:center; max-width:480px; width:100%; }

    .script-title {
      font-family: 'Great Vibes', cursive;
      font-size: clamp(2.8rem, 8vw, 4.2rem);
      color: var(--charcoal); line-height: 1.1; margin-bottom: 6px;
    }

    .divider { display:flex; align-items:center; gap:14px; margin:20px auto 28px; max-width:280px; }
    .divider::before, .divider::after { content:''; flex:1; height:1px; background:var(--border); }
    .divider span { font-size:0.68rem; letter-spacing:0.22em; text-transform:uppercase; color:var(--warm-grey); }

    .welcome-text { font-size:1rem; font-style:italic; color:#777; line-height:1.7; margin-bottom:36px; }

    input[type="password"] {
      width:100%; padding:14px 20px; border:1px solid var(--border); background:white;
      font-family:'Cormorant Garamond',serif; font-size:1.1rem; color:var(--charcoal);
      text-align:center; letter-spacing:0.15em; outline:none;
      transition:border-color 0.2s; margin-bottom:14px;
    }
    input[type="password"]:focus { border-color: var(--sage); }

    button.enter-btn {
      width:100%; padding:14px 20px; background:var(--sage); color:white; border:none;
      font-family:'Cormorant Garamond',serif; font-size:0.78rem; letter-spacing:0.25em;
      text-transform:uppercase; cursor:pointer; transition:background 0.2s;
    }
    button.enter-btn:hover { background: var(--sage-dark); }

    .error { margin-top:14px; font-size:0.78rem; letter-spacing:0.12em; color:#b56060; font-style:italic; display:none; }

    /* POPUP */
    .popup-overlay {
      display:none; position:fixed; inset:0;
      background:rgba(0,0,0,0.45); z-index:999;
      align-items:center; justify-content:center; padding:20px;
    }
    .popup-overlay.active { display:flex; }

    .popup-box {
      background:var(--cream); max-width:460px; width:100%;
      text-align:center; padding:48px 40px 40px;
      animation: popIn 0.3s ease;
    }
    @keyframes popIn {
      from { opacity:0; transform:scale(0.92) translateY(12px); }
      to   { opacity:1; transform:scale(1) translateY(0); }
    }

    .popup-icon { font-size:2rem; margin-bottom:16px; display:block; }
    .popup-title {
      font-family:'Great Vibes',cursive; font-size:2.4rem;
      color:var(--charcoal); line-height:1.2; margin-bottom:8px;
    }
    .popup-sub { font-size:0.95rem; font-style:italic; color:#777; margin-bottom:30px; line-height:1.6; }

    .popup-btn {
      display:block; width:100%; padding:13px 20px; margin-bottom:10px;
      font-family:'Cormorant Garamond',serif; font-size:0.8rem;
      letter-spacing:0.15em; text-transform:uppercase; cursor:pointer;
      border:1px solid var(--border); background:white; color:var(--charcoal);
      transition:all 0.2s;
    }
    .popup-btn:hover { border-color:var(--sage); color:var(--sage-dark); }
    .popup-btn.primary { background:var(--sage); color:white; border-color:var(--sage); }
    .popup-btn.primary:hover { background:var(--sage-dark); color:white; }
    .popup-btn.subtle {
      font-size:0.8rem; letter-spacing:0.03em; text-transform:none; font-style:italic;
      color:var(--warm-grey); border-color:transparent; background:transparent;
    }
    .popup-btn.subtle:hover { color:var(--sage-dark); background:transparent; }
  </style>
</head>
<body>

  <div class="top-bar">
    <a href="rsvp.html">RSVP &rarr;</a>
  </div>

  <div class="password-wrap">
    <div class="password-inner">
      <div class="script-title">Danielle &amp; Martin</div>
      <div class="divider"><span>Welcome</span></div>
      <p class="welcome-text">We're so excited to celebrate with you.<br/>Please enter the password to access our wedding website.</p>
      <input type="password" id="pwd" placeholder="Enter password" onkeydown="if(event.key==='Enter') checkPassword()"/>
      <button class="enter-btn" onclick="checkPassword()">Enter</button>
      <p class="error" id="error">Incorrect password — please try again.</p>
    </div>
  </div>

  <!-- RSVP POPUP -->
  <div class="popup-overlay" id="rsvp-popup">
    <div class="popup-box">
      <span class="popup-icon">💍</span>
      <div class="popup-title">Have you RSVP'd yet?</div>
      <p class="popup-sub">We'd love to know if you can make it!</p>
      <button class="popup-btn" onclick="goHome()">Yes</button>
      <button class="popup-btn primary" onclick="window.location.href='rsvp.html'">No, bring me there now please!</button>
      <button class="popup-btn subtle" onclick="goHome()">Maybe later, I'm waiting to decide if I like you enough...</button>
    </div>
  </div>

  <script>
    function checkPassword() {
      const val = document.getElementById('pwd').value;
      if (val === 'dani69') {
        sessionStorage.setItem('weddingAuth', 'true');
        document.getElementById('rsvp-popup').classList.add('active');
      } else {
        document.getElementById('error').style.display = 'block';
        document.getElementById('pwd').value = '';
        document.getElementById('pwd').focus();
      }
    }
    function goHome() { window.location.href = 'home.html'; }
  </script>
</body>
</html>
